name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quiz-platform-frontend" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/quiz-platform-ui
          file: ./frontend/quiz-platform-ui/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render deployment (optional)
        env:
          FRONTEND_RENDER_DEPLOY_HOOK: ${{ secrets.FRONTEND_RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$FRONTEND_RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$FRONTEND_RENDER_DEPLOY_HOOK"
          else
            echo "FRONTEND_RENDER_DEPLOY_HOOK is not set. Skipping deploy trigger."
          fi
