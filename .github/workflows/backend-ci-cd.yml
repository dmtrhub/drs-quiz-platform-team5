name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: main-service
            context: ./backend/main-service
            dockerfile: ./backend/main-service/Dockerfile.prod
            image_suffix: quiz-platform-main-service
            deploy_hook_secret: MAIN_SERVICE_RENDER_DEPLOY_HOOK
          - service_name: quiz-service
            context: ./backend/quiz-service
            dockerfile: ./backend/quiz-service/Dockerfile.prod
            image_suffix: quiz-platform-quiz-service
            deploy_hook_secret: QUIZ_SERVICE_RENDER_DEPLOY_HOOK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.service_name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render deployment for main-service
        if: ${{ matrix.service_name == 'main-service' }}
        env:
          MAIN_SERVICE_RENDER_DEPLOY_HOOK: ${{ secrets.MAIN_SERVICE_RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$MAIN_SERVICE_RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$MAIN_SERVICE_RENDER_DEPLOY_HOOK"
          else
            echo "MAIN_SERVICE_RENDER_DEPLOY_HOOK is not set. Skipping deploy trigger."
          fi

      - name: Trigger Render deployment for quiz-service
        if: ${{ matrix.service_name == 'quiz-service' }}
        env:
          QUIZ_SERVICE_RENDER_DEPLOY_HOOK: ${{ secrets.QUIZ_SERVICE_RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$QUIZ_SERVICE_RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$QUIZ_SERVICE_RENDER_DEPLOY_HOOK"
          else
            echo "QUIZ_SERVICE_RENDER_DEPLOY_HOOK is not set. Skipping deploy trigger."
          fi
